name: Release

# Releases are cut by pushing a tag. Nothing here runs on `main`, because publishing to
# crates.io is irreversible: a version number, once taken, can be yanked but never reused.
#
# `workflow_dispatch` exists for a dry run — it builds and verifies everything and stops
# short of both publish steps, so the release path itself can be exercised without
# spending a version number on finding out that it works.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that can say "no" runs before anything that cannot be undone.
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The tag and the manifest are two places that state the version, and a release
      # where they disagree is one where `cargo install cim-rs@1.2.3` and the GitHub
      # release page describe different code. Checked first because it costs nothing and
      # is the mistake most easily made.
      - name: Tag matches the manifest version
        id: version
        run: |
          # Selected by name: `--no-deps` still reports every workspace member, and
          # `packages[0]` is whichever one Cargo happens to list first — which is `xtask`,
          # whose version is 0.0.0 and would make every tag mismatch.
          manifest="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          pkgs = json.load(sys.stdin)["packages"]
          print(next(p["version"] for p in pkgs if p["name"] == "cim-rs"))')"
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [ "$tag" != "$manifest" ]; then
              echo "::error::tag v$tag does not match Cargo.toml version $manifest"
              exit 1
            fi
          fi
          echo "releasing $manifest"

      # The same gates CI runs, repeated here rather than assumed: a tag can be pushed at
      # a commit CI never saw, and `--locked` is what makes the released build the one
      # whose dependency versions were tested.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Documentation
        run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # `cargo publish --dry-run` builds the tarball exactly as the registry will receive
      # it, from a clean checkout of what it contains — so a file the library needs but
      # `exclude` drops fails here rather than on crates.io, where it cannot be fixed
      # without a new version.
      - name: Publishable tarball
        run: cargo publish --dry-run --locked

  # Built from the tag so `cim --version` matches the release, and before publishing, so a
  # platform that cannot build stops the release rather than leaving the crate published
  # with binaries missing.
  binaries:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Both vintages, because a downloaded binary cannot be recompiled for the other one;
      # `cli` brings in `zip`, since a model set handed to a tool is as likely to be an
      # archive as a directory.
      - name: Build
        run: cargo build --release --locked --bin cim --target ${{ matrix.target }}
             --no-default-features --features cli,cgmes3,cgmes2

      # A checksum beside each archive, because the release page is where someone
      # scripting an install gets the file and there is otherwise nothing to check it
      # against.
      - name: Package
        shell: bash
        run: |
          name="cim-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/cim.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/cim" "dist/$name/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            certutil -hashfile "$name.zip" SHA256 | sed -n 2p | tr -d ' \r' > "$name.zip.sha256"
          else
            tar czf "$name.tar.gz" "$name"
            if command -v sha256sum > /dev/null; then
              sha256sum "$name.tar.gz" | cut -d' ' -f1 > "$name.tar.gz.sha256"
            else
              shasum -a 256 "$name.tar.gz" | cut -d' ' -f1 > "$name.tar.gz.sha256"
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # The irreversible step, last, and only for a real tag.
  publish:
    name: publish to crates.io
    needs: [verify, binaries]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: github release
    needs: [verify, binaries, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --title "cim-rs $VERSION" \
            --generate-notes \
            --notes "Install the library with \`cargo add cim-rs\`, or the command line with \`cargo install cim-rs --features cli\`. Prebuilt \`cim\` binaries are attached, each with a SHA-256 checksum."
