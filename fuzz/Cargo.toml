[package]
name = "cim-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cim-rs = { path = ".." }
# The roundtrip target proves its output is well-formed XML with the checks turned *on*,
# which is the opposite setting from the one the reader runs with. Same library, different
# question — and it is the question a tolerant reader cannot answer about its own output.
quick-xml = "0.41"

[[bin]]
name = "read_cimxml"
path = "fuzz_targets/read_cimxml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
