[package]
# `cim` on crates.io is taken by an unrelated code generator, so the package is published
# under the repository's own name and the library keeps Cargo's default `cim_rs` for it.
# `[lib] name = "cim"` would recover the shorter import at the cost of an import path that
# does not match what the reader typed into `cargo add`.
name = "cim-rs"
version = "0.1.0"
description = "IEC Common Information Model (CIM/CGMES) for power systems: typed model, CIM/XML I/O, profile-aware validation"
keywords = ["cim", "cgmes", "iec61970", "power-systems", "grid"]
categories = ["science", "parser-implementations", "encoding"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The published crate is the library and nothing else; everything listed here is repository
# machinery. Enforced by `cargo package` in CI rather than by directory layout.
exclude = [
    "/xtask",
    "/fuzz",
    "/specs",
    "/.github",
    "/.cargo",
    "/deny.toml",
    "/CONTRIBUTING.md",
    # The containerised PowSyBl and rdflib harnesses.
    "/crossvalidate",
    # The site's presentation, but not its `content/`: those pages' Rust examples are
    # doctests, so shipping them keeps the tarball's own test suite runnable.
    "/site/templates",
    "/site/static",
    "/site/public",
    "/site/config.toml",
]

[workspace]
# The crate is the root package rather than a member under `crates/`: it is the only
# published one, and at the root the repository README and the crate's front page are one
# file instead of two that can drift. `xtask` is a member so `cargo xtask` builds it, and
# unpublished so the published surface stays a single crate.
members = ["xtask"]
# `fuzz` has its own profile and nightly toolchain and sits inside the root package's
# directory tree, so it must be named here or Cargo adopts it and neither builds. Distinct
# from `package.exclude` above, which is about what `cargo package` ships.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
# `let` chains, used throughout, stabilised in 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/cim-rs"
authors = ["Frank Hübner <hupe@huebner-frank.de>"]

[workspace.dependencies]
quick-xml = "0.41"
anyhow = "1"

[dependencies]
quick-xml.workspace = true
zip = { version = "2", optional = true, default-features = false, features = [
    "deflate",
] }

[features]
default = ["cgmes3"]

# CGMES 3.0 (IEC TS 61970-600-1/-2:2021) — the current interop target.
cgmes3 = []
# CGMES 2.4.15 — the profile set in production use across Europe since 2021.
cgmes2 = []

# Read and write CGMES model sets packaged as zip archives.
zip = ["dep:zip"]

# The `cim` command line: `cargo install cim-rs --features cli`. Off by default so using the
# crate as a library never compiles a binary. Implies `zip` — a model set given to a command
# line is as often an archive as a directory — and adds no dependency of its own.
cli = ["zip"]

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "cim"
path = "src/bin/cim.rs"
required-features = ["cli"]

# The binary above is the tool; these are the API, one task each: building a model,
# navigating one, exporting RDF, computing a change set.
[[example]]
name = "build_model"
required-features = ["cgmes3"]

[[example]]
name = "inspect"
required-features = ["cgmes3"]

[[example]]
name = "to_rdf"
required-features = ["cgmes3"]

[[example]]
name = "changes"
required-features = ["cgmes3"]

[[bench]]
name = "throughput"
harness = false
required-features = ["cgmes3"]
# Cargo runs `[[bench]]` targets in test mode by default, which makes `cargo test` execute
# the benchmark in a debug build over the whole corpus. `cargo bench` runs it; `cargo clippy
# --all-targets` lints it.
test = false

[package.metadata.docs.rs]
all-features = true
