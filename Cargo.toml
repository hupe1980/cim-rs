[package]
# `cim` on crates.io has been taken since 2022 by an unrelated code generator, so the
# package is published under the repository's own name. The library keeps Cargo's default
# name for it — `cim_rs` — rather than overriding `[lib] name`: an import path that does not
# match the package anyone typed into `cargo add` is a small, permanent surprise, and Rust
# programmers already read `foo-bar` on the registry as `foo_bar` in a `use`.
name = "cim-rs"
version = "0.1.0"
description = "IEC Common Information Model (CIM/CGMES) for power systems: typed model, CIM/XML I/O, profile-aware validation"
keywords = ["cim", "cgmes", "iec61970", "power-systems", "grid"]
categories = ["science", "parser-implementations", "encoding"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The published crate is the library and nothing else. Everything below is repository
# machinery: the generator that fetches the standards artifacts and produces
# `src/generated`, the fuzz targets, and the artifacts themselves.
exclude = [
    "/xtask",
    "/fuzz",
    "/specs",
    "/.github",
    "/.cargo",
    "/deny.toml",
    "/CONCEPT.md",
    # The cross-validation harnesses: a Maven project and a Python script, run in pinned
    # containers to check this crate's output against implementations that are not it.
    "/crossvalidate",
    # The documentation site's presentation is repository machinery; its `content/` is not.
    # Those pages' Rust examples are compiled as doctests, so shipping them keeps the
    # tarball's own test suite runnable — the same reason the README is shipped.
    "/site/templates",
    "/site/static",
    "/site/public",
    "/site/config.toml",
]

[workspace]
# The crate lives at the repository root rather than under `crates/`: it is the only
# published package, and a directory holding exactly one thing is a level of nesting that
# earns nothing. It did cost something — with the crate one level down, the repository
# README and the crate's own front page were two files, so the generator copied one to the
# other and CI checked they had not drifted. At the root they are the same file.
#
# `xtask` stays a member so `cargo xtask codegen` builds it, and stays unpublished so the
# published surface remains a single crate.
members = ["xtask"]
# `fuzz` is a package of its own that `cargo-fuzz` drives with its own profile and its own
# nightly toolchain, and it now sits inside the root package's directory tree — so it has
# to be named here or Cargo tries to adopt it and refuses to build either one. (Distinct
# from `package.exclude` above, which is about what `cargo package` ships.)
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
# 1.88 is where `let` chains stabilised, and the code uses them throughout. The manifest
# said 1.85 — the edition floor — which no compiler could actually build.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/cim-rs"
authors = ["Frank Hübner <hupe@huebner-frank.de>"]

[workspace.dependencies]
quick-xml = "0.41"
anyhow = "1"

[dependencies]
quick-xml.workspace = true
zip = { version = "2", optional = true, default-features = false, features = [
    "deflate",
] }

[features]
default = ["cgmes3"]

# CGMES 3.0 (IEC TS 61970-600-1/-2:2021) — the current interop target.
cgmes3 = []
# CGMES 2.4.15 — the profile set in production use across Europe since 2021.
cgmes2 = []

# Read and write CGMES model sets packaged as zip archives.
zip = ["dep:zip"]

# The `cim` command line. Off by default so that using the crate as a library never
# compiles a binary, and on for `cargo install cim-rs --features cli`. It pulls in `zip`
# because a model set handed to a command line is as likely to be an archive as a
# directory, and adds no dependency of its own.
cli = ["zip"]

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "cim"
path = "src/bin/cim.rs"
required-features = ["cli"]

# Runnable library examples. The `cim` binary above is the tool; these are the API, one
# task each — building a model, navigating one, exporting RDF, computing a change set.
[[example]]
name = "build_model"
required-features = ["cgmes3"]

[[example]]
name = "inspect"
required-features = ["cgmes3"]

[[example]]
name = "to_rdf"
required-features = ["cgmes3"]

[[example]]
name = "changes"
required-features = ["cgmes3"]

[[bench]]
name = "throughput"
harness = false
required-features = ["cgmes3"]
# Cargo runs `[[bench]]` targets in test mode by default, so `cargo test` was *executing* the
# benchmark — in a debug build, over the whole 112 MiB RealGrid model when the corpus is
# present. That is twenty minutes of a developer's `cargo test` spent producing throughput
# figures twenty times too low to mean anything, and CI paid for it twice, since the
# conformance job runs `cargo bench` afterwards anyway. `cargo bench` still builds and runs
# it; `cargo clippy --all-targets` still lints it.
test = false

[package.metadata.docs.rs]
all-features = true
