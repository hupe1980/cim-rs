# cargo-deny configuration. The dependency tree is deliberately tiny, so the policy can
# be strict.

[graph]
# The policy exists to protect people who depend on `cim`, and `xtask` is never published:
# it is the repository's own tooling, and it needs an HTTP client and a zip reader to fetch
# the standards artifacts. Holding a build tool to the same licence and advisory bar as the
# library would either weaken the bar for the library — the only place it matters — or ban
# a dev dependency for a reason that reaches no user.
exclude = ["xtask"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only; the crate itself is MIT OR Apache-2.0.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
